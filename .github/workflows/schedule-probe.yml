name: Schedule Probe

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print schedule probe timestamp
        run: date -u +"schedule probe at %Y-%m-%dT%H:%M:%SZ"
